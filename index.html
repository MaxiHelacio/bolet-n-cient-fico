<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeNadA | Portal de Noticias Científicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-hover: #1e293b;
            --accent-blue: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --border-highlight: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* HEADER & BRANDING */
        header {
            background: linear-gradient(180deg, #131b2e 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 3rem 1.5rem 2rem 1.5rem;
            text-align: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .brand-logo {
            height: 52px;
            width: auto;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .brand-title span {
            color: var(--accent-blue);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
        }

        /* PANEL DE BÚSQUEDA Y FILTROS */
        .controls-wrapper {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .search-box {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .search-bar {
            flex: 1;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-highlight);
            background: var(--card-bg);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .category-select {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-highlight);
            background: var(--card-bg);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* CHIPS DE CATEGORÍAS */
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background: var(--accent-glow);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* SECCIÓN PRINCIPAL / GRID */
        main {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .badge {
            align-self: flex-start;
            background: var(--accent-glow);
            color: var(--accent-blue);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 0.8rem;
            color: var(--text-main);
        }

        .card-summary {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .card-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: gap 0.2s ease;
        }

        .card-footer a:hover {
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 0;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--bg-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <!-- ISOTIPO OFICIAL DeNadA (SVG) -->
            <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#38bdf8" stroke-width="3" transform="rotate(30 50 50)"/>
                <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#38bdf8" stroke-width="3" transform="rotate(-30 50 50)"/>
                <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#38bdf8" stroke-width="3" transform="rotate(90 50 50)"/>
                <circle cx="50" cy="50" r="8" fill="#38bdf8"/>
            </svg>
            <h1 class="brand-title">DeNad<span>A</span></h1>
        </div>
        <p class="subtitle">Boletín de Noticias Científicas & Archivo Histórico</p>
        
        <div class="controls-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-bar" placeholder="Buscar por palabra clave o título...">
                <select id="categoryFilter" class="category-select">
                    <option value="ALL">Todas las categorías</option>
                </select>
            </div>
            
            <div class="category-chips" id="categoryChips">
                <button class="chip active" onclick="filtrarPorChip('ALL')">Todas</button>
            </div>
        </div>
    </header>

    <main>
        <div id="newsGrid" class="grid"></div>
        <div id="emptyMessage" class="empty-state" style="display: none;">No se encontraron publicaciones que coincidan con la búsqueda.</div>
    </main>

    <footer>
        <p>DeNadA Pipeline • Maxi Jesús López Helacio | Instituto Tecnológico de Celaya</p>
    </footer>

    <script>
        let todasLasNoticias = [];

        async function cargarHistorico() {
            try {
                const response = await fetch('./historico_noticias.json');
                if (!response.ok) throw new Error("Error cargando histórico.");
                todasLasNoticias = await response.json();
                
                // Mostrar noticias más recientes primero
                todasLasNoticias.reverse();
                
                poblarCategorias();
                renderizarNoticias(todasLasNoticias);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('newsGrid').innerHTML = '<p class="empty-state">No hay historias disponibles en el histórico actualmente.</p>';
            }
        }

        function poblarCategorias() {
            const select = document.getElementById('categoryFilter');
            const chipsContainer = document.getElementById('categoryChips');
            
            const categorias = [...new Set(todasLasNoticias.map(n => n.categoria || 'General'))];
            
            categorias.forEach(cat => {
                // Agregar al desplegable
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);

                // Agregar como chip rápido
                const chipBtn = document.createElement('button');
                chipBtn.className = 'chip';
                chipBtn.textContent = cat;
                chipBtn.onclick = () => filtrarPorChip(cat);
                chipsContainer.appendChild(chipBtn);
            });
        }

        function renderizarNoticias(noticias) {
            const grid = document.getElementById('newsGrid');
            const emptyMessage = document.getElementById('emptyMessage');
            grid.innerHTML = '';

            if (noticias.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }
            emptyMessage.style.display = 'none';

            noticias.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <span class="badge">${item.categoria || 'Ciencia'}</span>
                        <h2 class="card-title">${item.titulo}</h2>
                        <p class="card-summary">${item.resumen}</p>
                    </div>
                    <div class="card-footer">
                        <span>${item.fecha || ''} ${item.fuente ? '• ' + item.fuente : ''}</span>
                        <a href="${item.url}" target="_blank" rel="noopener">Leer más ↗</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarNoticias() {
            const busqueda = document.getElementById('searchInput').value.toLowerCase();
            const categoria = document.getElementById('categoryFilter').value;

            // Sincronizar estado visual de los chips
            document.querySelectorAll('.chip').forEach(chip => {
                if(chip.textContent === categoria || (categoria === 'ALL' && chip.textContent === 'Todas')) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            const filtradas = todasLasNoticias.filter(noticia => {
                const coincideTexto = noticia.titulo.toLowerCase().includes(busqueda) || 
                                      noticia.resumen.toLowerCase().includes(busqueda);
                const coincideCategoria = categoria === 'ALL' || noticia.categoria === categoria;
                return coincideTexto && coincideCategoria;
            });

            renderizarNoticias(filtradas);
        }

        function filtrarPorChip(cat) {
            document.getElementById('categoryFilter').value = cat;
            filtrarNoticias();
        }

        document.getElementById('searchInput').addEventListener('input', filtrarNoticias);
        document.getElementById('categoryFilter').addEventListener('change', filtrarNoticias);

        // Inicializar
        cargarHistorico();
    </script>
</body>
</html>
